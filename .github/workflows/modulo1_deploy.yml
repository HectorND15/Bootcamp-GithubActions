# Yaml example of module1
name: Deploy Module 1

on:
  push:
    branches: [ modulo1 ]

jobs:
  first_job:
    name: primer job
    runs-on: ubuntu-latest
    steps:
      - name: Revisar Directorio Output
        id: step_1
        run: echo $GITHUB_OUTPUT

      - name: Guardar una variable en la salida
        id: step_2
        run: echo "my_var=Hola mundo" >> $GITHUB_OUTPUT

        # Para hacer referencia a otro step, deberemos de usar el contexto con su id, el cual deberemos crear previamente. 
      - name: Obtener Mensaje
        run: echo "  "

  second_job:
    name: segundo job
    if: ${{ github.ref != 'refs/head/main' }}
    needs: first_job
    runs-on: ubuntu-latest
    steps:
      - name: Hello world
        run: echo "Hello world"

  third_job:
    name: tercer job
    needs: second_job
    runs-on: ubuntu-latest
    
    steps:
      - name: working dir
        run: ls -al
      
      - name: Action
        uses: actions/checkout@v4
      
      - name: working dir
        run: ls -al
    

