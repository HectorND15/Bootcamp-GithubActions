# Yaml example of module1
name: Deploy Module 1

on:
  push:
    branches: [ modulo1 ]

jobs:
  first_job:
    name: primero job
    runs-on: ubuntu-latest
    steps:
      - name: Hello world
        run: echo "Hello world" 

  second_job:
    name: segundo job
    if: ${{ github.ref != 'refs/head/main' }}
    needs: first_job
    runs-on: ubuntu-latest
    steps:
      - name: Hello world
        run: echo "Hello world"

  third_job:
    name: tercer job
    needs: second_job
    runs-on: ubuntu-latest
    
    steps:
      - name: working dir
        run: ls -al
      
      - name: Action
        uses: actions/checkout@v4
      
      - name: working dir
        run: ls -al
    

